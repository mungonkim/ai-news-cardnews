name: 예약 실행 점검 (임시)

# 이 저장소에서 GitHub 예약 실행이 실제로 도는지 확인하는 임시 워크플로다.
# 정해진 시각에 슬랙으로 알림 한 줄을 보낸다. 확인이 끝나면 지운다.
on:
  schedule:
    # 정해진 시각 두 번 (한국 시간 12시 17분, 12시 33분). 잦은 예약은 깃허브가 자주 건너뛴다
    - cron: '17 3 * * *'
    - cron: '33 3 * * *'
  # 슬랙 알림 자체가 되는지 손으로 확인할 때
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 슬랙으로 점검 알림 보내기
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          KST=$(TZ=Asia/Seoul date '+%m월 %d일 %H:%M')
          if [ "${{ github.event_name }}" = "schedule" ]; then HOW="예약으로 자동"; else HOW="손으로"; fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"text\":\"⏰ 예약 실행 점검: ${KST}(한국 시간)에 ${HOW} 실행됐어요.\"}" | grep -q '"ok":true'
