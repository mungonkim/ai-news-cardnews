name: 카드뉴스 만들기 (직접 실행)

# 2026-10-15부터 매일 자동 실행 자리는 공감툰(daily.yml)이 이어받았다. 카드뉴스는 필요할 때 직접 실행한다.
on:
  workflow_dispatch:
    inputs:
      url:
        description: '특정 기사 주소로 만들기 (비워 두면 자동 선정)'
        required: false
        default: ''
      skip_if_done:
        description: '오늘 카드를 이미 만들었으면 건너뛰기 (외부 예약 서비스가 "true"로 실행한다)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-cardnews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 브라우저 설치
        run: npx playwright-core install --with-deps chromium

      - name: 카드뉴스 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            npm start -- --url "$INPUT_URL"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.skip_if_done }}" = "true" ]; then
            npm start -- --skip-if-done
          else
            npm start
          fi

      - name: 다룬 기사 기록 저장
        if: success()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add data/covered-articles.json
          git diff --cached --quiet || git commit -m "다룬 기사 기록 추가"
          # 실행 중에 다른 커밋이 올라왔어도 기록이 빠지지 않게 먼저 합친 뒤 올린다
          git pull --rebase
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-output
          path: output/
          retention-days: 3
          if-no-files-found: ignore
