name: 매일 공감툰 만들기

# 2026-10-15부터 매일 자동 실행은 AI 뉴스 카드 대신 공감툰을 만든다 (카드뉴스는 cardnews.yml에서 직접 실행).
# 파일 이름(daily.yml)과 입력(skip_if_done)은 외부 예약 서비스(cron-job.org)가 그대로 부를 수 있게 유지한다.
on:
  schedule:
    # 매일 한국 시간 오전 7시 23분쯤 (UTC 22:23). 정각은 GitHub가 몰려서 건너뛰거나 늦추는 일이 잦아 비껴 둔다
    - cron: '23 22 * * *'
    # 보조 예약: GitHub 예약 실행은 가끔 통째로 빠지므로 8시 47분, 10시 13분에 한 번씩 더 건다.
    # 그날 툰을 이미 만들었으면 --skip-if-done 으로 바로 끝난다 (중복 없음)
    - cron: '47 23 * * *'
    - cron: '13 1 * * *'
  workflow_dispatch:
    inputs:
      skip_if_done:
        description: '오늘 툰을 이미 만들었으면 건너뛰기 (외부 예약 서비스가 "true"로 실행한다)'
        required: false
        default: ''
      url:
        description: '(쓰지 않음) 예전 카드뉴스 예약 호출과 맞추려고 남겨 둔 입력'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-toon
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 브라우저 설치
        run: npx playwright-core install --with-deps chromium

      - name: 공감툰 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.skip_if_done }}" = "true" ]; then
            node src/toon/run.ts --mode daily --skip-if-done
          else
            node src/toon/run.ts --mode daily
          fi

      - name: 대본과 기록 저장
        if: success()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add content/toon data/toon-made.json
          git diff --cached --quiet || git commit -m "오늘의 공감툰 대본과 기록 추가"
          git pull --rebase
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toon-output
          path: output/toon/
          retention-days: 3
          if-no-files-found: ignore
