name: 매일 카드뉴스 만들기

on:
  schedule:
    # 매일 한국 시간 오전 7시 23분쯤 (UTC 22:23). 정각은 GitHub가 몰려서 건너뛰거나 늦추는 일이 잦아 비껴 둔다
    - cron: '23 22 * * *'
    # 보조 예약: GitHub 예약 실행은 가끔 통째로 빠지므로 8시 47분, 10시 13분에 한 번씩 더 건다.
    # 그날 카드를 이미 만들었으면 --skip-if-done 으로 바로 끝난다 (중복 없음)
    - cron: '47 23 * * *'
    - cron: '13 1 * * *'
  # 직접 실행해서 확인할 때 사용
  workflow_dispatch:
    inputs:
      url:
        description: '특정 기사 주소로 만들기 (비워 두면 자동 선정)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-cardnews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 브라우저 설치
        run: npx playwright-core install --with-deps chromium

      - name: 카드뉴스 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            npm start -- --url "$INPUT_URL"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            npm start -- --skip-if-done
          else
            npm start
          fi

      - name: 다룬 기사 기록 저장
        if: success()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add data/covered-articles.json
          git diff --cached --quiet || git commit -m "다룬 기사 기록 추가"
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-output
          path: output/
          retention-days: 3
          if-no-files-found: ignore
