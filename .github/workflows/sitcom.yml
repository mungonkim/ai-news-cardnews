name: AI 시트콤 만들기

on:
  schedule:
    # 매주 월요일 한국 시간 오전 9시 17분쯤 (UTC 월요일 00:17). 정각은 건너뛰는 일이 잦아 비껴 둔다
    - cron: '17 0 * * 1'
  # 직접 실행할 때 대본 파일을 고를 수 있다 (비우면 아직 안 만든 다음 대본)
  workflow_dispatch:
    inputs:
      episode:
        description: '대본 JSON 경로 (비우면 아직 안 만든 다음 대본, 예: content/sitcom/2026-10-12-diet-starts-today.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sitcom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 편집 도구와 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: 시트콤 만들기
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            npm run sitcom -- "$EPISODE"
          else
            npm run sitcom
          fi

      # 기준 장면 이미지(처음 한 번)와 만든 편 기록을 저장소에 남긴다
      - name: 기록 저장
        if: success()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add assets/sitcom/base.png data/sitcom-made.json
          git diff --cached --quiet || git commit -m "시트콤 기록 추가"
          git pull --rebase
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitcom-output
          path: output/sitcom/
          retention-days: 3
          if-no-files-found: ignore
