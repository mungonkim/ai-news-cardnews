name: AI 시트콤 만들기

on:
  # 직접 실행할 때 대본 파일을 고른다
  workflow_dispatch:
    inputs:
      episode:
        description: '대본 JSON 경로 (예: content/sitcom/2026-10-10-one-word-email.json)'
        required: true

permissions:
  contents: write

concurrency:
  group: sitcom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 편집 도구와 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: 시트콤 만들기
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: npm run sitcom -- "$EPISODE"

      # 처음 만든 기준 장면 이미지는 저장소에 남겨 다음 편에도 같은 인물을 쓴다
      - name: 기준 장면 이미지 저장
        if: success()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add assets/sitcom/base.png
          git diff --cached --quiet || git commit -m "시트콤 기준 장면 이미지 추가"
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitcom-output
          path: output/sitcom/
          retention-days: 3
          if-no-files-found: ignore
