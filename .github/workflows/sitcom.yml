name: AI 시트콤 만들기

on:
  schedule:
    # 매주 월요일 한국 시간 오전 9시 17분쯤 (UTC 월요일 00:17). 정각은 건너뛰는 일이 잦아 비껴 둔다
    - cron: '17 0 * * 1'
    # 보조 예약: GitHub 예약 실행이 빠질 때를 대비해 10시 47분, 12시 13분에 한 번씩 더 건다 (이미 만들었으면 바로 끝난다)
    - cron: '47 1 * * 1'
    - cron: '13 3 * * 1'
  # 직접 실행할 때 대본 파일을 고를 수 있다 (비우면 아직 안 만든 다음 대본)
  workflow_dispatch:
    inputs:
      episode:
        description: '대본 JSON 경로 (비우면 아직 안 만든 다음 대본, 예: content/sitcom/2026-10-12-diet-starts-today.json)'
        required: false
        default: ''
      scheduled:
        description: '예약 실행처럼 동작 (오늘 이미 만들었으면 건너뛰기). 외부 예약 서비스가 "true"로 실행한다'
        required: false
        default: ''
      estimate:
        description: '"true"면 영상을 만들지 않고 예상 비용만 확인 (요금 없음)'
        required: false
        default: ''
      video_endpoint:
        description: '비교용 영상 모델 주소 (비우면 Seedance 2.5)'
        required: false
        default: ''
      from_run:
        description: '편집만 다시 할 때: 이전 실행 번호(run id). 그 실행의 구간 영상을 가져와 새로 만들지 않는다 (3일 안의 실행만)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: sitcom
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 편집 도구와 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: 이전 실행의 구간 영상 가져오기 (편집만 다시 할 때)
        if: github.event.inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: sitcom-output
          path: output/sitcom
          run-id: ${{ github.event.inputs.from_run }}
          github-token: ${{ github.token }}

      - name: 시트콤 만들기
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          EPISODE: ${{ github.event.inputs.episode }}
          # 비교용: 다른 영상 모델의 주소로 바꿔 볼 때만 쓴다 (비우면 기본 모델)
          SITCOM_VIDEO_ENDPOINT: ${{ github.event.inputs.video_endpoint || 'bytedance/seedance-2.5/reference-to-video' }}
        run: |
          if [ "${{ github.event.inputs.estimate }}" = "true" ]; then
            npm run sitcom -- $EPISODE --estimate --no-slack
          elif [ -n "$EPISODE" ]; then
            npm run sitcom -- "$EPISODE"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.scheduled }}" = "true" ]; then
            npm run sitcom -- --scheduled
          else
            npm run sitcom
          fi

      # 기준 장면 이미지(처음 한 번), 만든 편 기록, 접수한 요청 번호를 저장소에 남긴다.
      # 실패해도 저장한다: 요금을 낸 요청 번호가 남아야 다음 실행이 새로 결제하지 않고 결과를 받아 온다
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add assets/sitcom data/sitcom-made.json data/sitcom-pending.json
          git diff --cached --quiet || git commit -m "시트콤 기록 추가"
          git pull --rebase
          git push

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitcom-output
          path: output/sitcom/
          retention-days: 3
          if-no-files-found: ignore
